
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de TMB</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Calculadora de TMB</h1>

        <p>Descubra quantas calorias seu corpo gasta em repouso.</p>

        <div class="formulario">

            <label for="sexo">Sexo:</label>
            <select id="sexo">
                <option value="">Selecione</option>
                <option value="masculino">Masculino</option>
                <option value="feminino">Feminino</option>
            </select>

            <label for="idade">Idade (anos):</label>
            <input type="number" id="idade" placeholder="Ex: 25">

            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso" placeholder="Ex: 70">

            <label for="altura">Altura (cm):</label>
            <input type="number" id="altura" placeholder="Ex: 175">

            <button onclick="calcularTMB()">Calcular TMB</button>

        </div>

        <div id="resultado"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
