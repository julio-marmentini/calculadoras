
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Salário Líquido</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Calculadora de Salário Líquido</h1>

        <p>Descubra quanto você vai receber após os descontos.</p>

        <div class="formulario">

            <label for="salario">Salário Bruto (R$):</label>
            <input type="number" id="salario" placeholder="Ex: 3000">

            <label for="dependentes">Número de dependentes:</label>
            <input type="number" id="dependentes" placeholder="Ex: 2" value="0">

            <label for="outros">Outros descontos (R$):</label>
            <input type="number" id="outros" placeholder="Ex: 100" value="0">

            <button onclick="calcularSalario()">Calcular Salário</button>

        </div>

        <div id="resultado"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
